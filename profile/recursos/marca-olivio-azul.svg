<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 740 240"
     role="img" aria-label="Olivio">
  <title>Olivio</title>
  <defs>

    <style>
      /* paleta c2 — azules */
      :root {
        --ol-p:        #1C6E89;
        --ol-p-luz:    #2E9ABF;  /* derivado primario +30% L */
        --ol-p-sombra: #0E3E50;  /* derivado primario −35% L */
        --ol-a:        #42BCD4;
        --ol-a-luz:    #6DD8EB;  /* derivado acento +25% L */
        --ol-a-sombra: #1E8FA8;  /* derivado acento −25% L */
        --ol-shadow:   #061620;  /* derivado primario ultra-oscuro */
      }
    </style>

    <linearGradient id="gp" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="var(--ol-p-luz)"/>
      <stop offset="52%"  stop-color="var(--ol-p)"/>
      <stop offset="100%" stop-color="var(--ol-p-sombra)"/>
    </linearGradient>

    <linearGradient id="ga" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="var(--ol-a-luz)"/>
      <stop offset="52%"  stop-color="var(--ol-a)"/>
      <stop offset="100%" stop-color="var(--ol-a-sombra)"/>
    </linearGradient>

    <filter id="sombra" x="-8%" y="-12%" width="116%" height="136%"
            color-interpolation-filters="linearRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="10"
        style="flood-color: var(--ol-shadow); flood-opacity: .30;"/>
    </filter>

  </defs>

  <g filter="url(#sombra)"
     stroke-linecap="round" stroke-linejoin="round"
     stroke-width="34" fill="none">

    <!-- O -->
    <circle stroke="url(#gp)" cx="130" cy="130" r="60"/>
    <!-- L -->
    <line stroke="url(#gp)" x1="240" y1="40" x2="240" y2="190"/>
    <!-- i — punto -->
    <circle fill="url(#gp)" stroke="none" cx="290" cy="75" r="22"/>
    <!-- i — tallo -->
    <line stroke="url(#gp)" x1="290" y1="130" x2="290" y2="190"/>
    <!-- V -->
    <path stroke="url(#gp)" d="M340 130 L385 190 L430 130"/>
    <!-- i — punto -->
    <circle fill="url(#gp)" stroke="none" cx="480" cy="75" r="22"/>
    <!-- i — tallo -->
    <line stroke="url(#gp)" x1="480" y1="130" x2="480" y2="190"/>
    <!-- O acento -->
    <circle stroke="url(#ga)" cx="590" cy="130" r="60"/>

  </g>
</svg>
